[project]
name = "headlong-town-bridge"
version = "0.1.0"
description = "Connects Headlong minds to bodies in an AI Town world"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
headlong-town-bridge = "headlong_town.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlong_town"]
